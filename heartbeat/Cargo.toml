[package]
name = "at-heartbeat"
version = "0.1.0"
edition = "2021"

# Deliberately minimal: this binary is launched as a NORMAL user process after
# the SYSTEM service finishes its one-shot boot cleanup. It must NOT link any of
# the device-removal / registry / LAN-scan code that makes the main client look
# like a cheat loader to anti-cheat engines (ACE etc.). Keep the dependency set
# (and therefore the PE import table) as clean as possible.
[dependencies]
at-protocol = { path = "../protocol" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "io-util"] }
serde_json = "1"
base64 = "0.22"
chrono = "0.4"
gethostname = "0.5"
if-addrs = "0.13"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
]
